      .name { font: 800 76px "DejaVu Sans", Arial, sans-serif; letter-spacing: 0; }
      .field { font: 700 34px "DejaVu Sans", Arial, sans-serif; letter-spacing: 0; }
      .institution { font: 600 29px "DejaVu Sans", Arial, sans-serif; letter-spacing: 0; }
      .label { font: 700 22px "DejaVu Sans", Arial, sans-serif; letter-spacing: 0; }
      .small { font: 600 20px "DejaVu Sans", Arial, sans-serif; letter-spacing: 0; }
