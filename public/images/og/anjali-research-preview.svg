<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Dr. Anjali Dhabu research portfolio social preview</title>
  <desc id="desc">Custom social preview image for Dr. Anjali Dhabu, Rotational Seismology and Earthquake Engineering, University of Hamburg.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f1d2c"/>
      <stop offset="0.42" stop-color="#4a2437"/>
      <stop offset="1" stop-color="#0f5f72"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7fa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d4f3f4" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="roseGlow" cx="28%" cy="18%" r="56%">
      <stop offset="0" stop-color="#f3bdca" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#f3bdca" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="88%" cy="68%" r="52%">
      <stop offset="0" stop-color="#74d6d0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#74d6d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-12%" y="-18%" width="124%" height="136%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#1b1020" flood-opacity="0.32"/>
    </filter>
    <pattern id="dotGrid" width="34" height="34" patternUnits="userSpaceOnUse">
